project:
  name: "{name}"
  repo: "{repo}"

guidance: true

adapters:
  create:
    manual-create-script:                          # add as default to start using script
      mode: sync
      script: gtms/adapters/manual-create-script.sh
    agent-create-script:                           # add as default to start using script
      mode: sync
      script: gtms/adapters/agent-create-script.sh
  prime:
    manual-prime-script:                           # add as default to start using script
      mode: sync
      script: gtms/adapters/manual-prime-script.sh
      framework: manual
    agent-prime-script:                            # add as default to start using script
      mode: sync
      script: gtms/adapters/agent-prime-script.sh
      framework: manual
  automate:
    agent-automate:                                # built-in Tier 0 automate; the agent fills the stamped skeleton
      mode: sync
      framework: playwright
  execute:
    manual-execute-script:                         # add as default to start using script
      mode: sync
      script: gtms/adapters/manual-execute-script.sh
      framework: manual
    agent-execute-script:                          # add as default to start using script
      mode: sync
      script: gtms/adapters/agent-execute-script.sh
      framework: manual
    playwright-runner:
      mode: sync
      script: gtms/adapters/playwright-runner.sh
      framework: playwright
      output-dir: gtms/scripts/playwright
      artefact-glob: "gtms/scripts/playwright/**/{testcase}*.spec.ts"

defaults:
  create: manual-create
  prime: manual-prime
  automate: agent-automate
  execute: playwright-runner

# Triage classification values (ENH-200 / CON-040). Keys must match
# ^[a-z][a-z0-9-]*$; labels are optional friendly text. These are the built-in
# defaults; edit or replace them to fit your project. Removing the whole triage
# block also falls back to these defaults.
triage:
  values:
    app-wrong: ""
    test-wrong: Test definition problem
    automation-wrong: Automation implementation problem
    environment: Environment failure
    intermittent: Intermittent or order-dependent failure
    blocked: ""
